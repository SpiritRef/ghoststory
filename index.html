<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬼磕頭日誌 | 靈界紀實</title>
    <link rel="icon" href="pic/GhostKowtow.jpg" type="image/jpeg">
    <link rel="stylesheet" href="CSS/postFB.css">
</head>
<body>

<!-- 懸浮選單 -->
<div class="expandable-menu-container" id="menuContainer">
    <div class="menu-content" id="menuContent"></div>
    <button class="floating-service-btn" id="serviceBtn" onclick="toggleMenu()">
        <span id="serviceIcon">☰</span>
        <span id="serviceText">選單</span>
    </button>
</div>

<div class="container">
    <h1>📖 鬼磕頭紀實</h1>
    <p style="text-align: center;">—— 穿梭陰陽，紀錄最真實的靈界對話 ——</p>
    
    <!-- 搜尋與收藏篩選區 -->
    <div class="search-group">
        <input type="text" id="search" class="search-bar" placeholder="🔍 搜尋內容..." oninput="currentPage=1; updateDisplay()">
        <button id="favToggle" class="filter-fav-btn" onclick="toggleFavFilter()">⭐ 收藏</button>
    </div>

    <!-- 主題分類篩選 -->
    <select id="titleFilter" class="search-bar title-select" style="margin-top: -5px; background-color: #fff;" onchange="currentPage=1; updateDisplay()">
        <option value="">📌 所有主題標題</option>
    </select>

    <!-- 文章列表呈現區 -->
    <div id="post-list">
        <p style="text-align:center; padding:50px; color:#888;">正在載入資料...</p>
    </div>
</div>

<!-- 底部固定導覽座 -->
<div class="bottom-dock">
    <div class="dock-container">
        <!-- 排序與每頁筆數 -->
        <div class="control-row">
            <select id="sortOrder" class="control-select" onchange="updateDisplay()">
                <option value="desc">最新更新 (倒序)</option>
                <option value="asc">從頭開始 (順序)</option>
            </select>
            <select id="pageSize" class="control-select" onchange="currentPage=1; updateDisplay()">
                <option value="5">每頁 5 筆</option>
                <option value="10">每頁 10 筆</option>
                <option value="20" selected>每頁 20 筆</option>
                <option value="50">每頁 50 筆</option>
                <option value="100">每頁 100 筆</option>
                <option value="all">顯示全部</option>
            </select>
        </div>
        
        <!-- 分頁與跳頁導覽 -->
        <div class="pagination">
            <button onclick="changePage(-1)" id="prevBtn" class="page-btn">上一頁</button>
            
            <div class="page-info-group" style="display: flex; align-items: center; gap: 5px;">
                <span>第</span>
                <select id="pageJump" class="jump-select" style="padding: 2px 5px; border-radius: 4px;" onchange="jumpToPage()">
                    <option value="1">1</option>
                </select>
                <span id="pageNum" class="page-num-display">/ 1 頁</span>
            </div>
            
            <button onclick="changePage(1)" id="nextBtn" class="page-btn">下一頁</button>
        </div>
    </div>
</div>

<!-- 文章彈窗 -->
<div id="postModal" style="display:none;">
    <div id="modal-header-title"></div>
    <div id="modal-images"></div>
    <div id="modal-body"></div>
</div>

<footer>
    <p>&copy; 2026 鬼磕頭日誌 | 靈界紀實. All Rights Reserved.</p>
</footer>

<!-- 核心邏輯 -->
<script type="module" src="Javascript/postFB.js"></script>

<!-- 全域橋接函式 -->
<script>
    window.toggleMenu = function() {
        const menu = document.getElementById('menuContainer');
        if (menu) menu.classList.toggle('show-menu');
    };

    window.jumpToPage = function() {
        const select = document.getElementById('pageJump');
        if (select && window.updateDisplay) {
            // 觸發自定義跳頁事件或直接修改全域變數
            window.currentPage = parseInt(select.value);
            window.updateDisplay();
            window.scrollTo(0, 0);
        }
    };
</script>

</body>
</html>
