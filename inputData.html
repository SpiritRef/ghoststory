<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="robots" content="noindex,nofollow">
	<title>小說庫後台 - 內容匯入與圖片上傳</title>
	<link rel="icon" href="https://spiritref.github.io/GhostKowtow.ico" type="image/x-icon">
    <link rel="shortcut icon" href="https://spiritref.github.io/GhostKowtow.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://spiritref.github.io/GhostKowtow.jpg">
	<style>
		body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
		.admin-card { background: linear-gradient(135deg, #f7ebd7 0%, #e6d3af 100%); padding: 25px; border-radius: 12px; border: 1px solid #dcbfa2; border-left: 5px solid #8b7355; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 450px; color: #3e2723; }
		.field { margin-bottom: 15px; }
		label { display: block; margin-bottom: 5px; font-weight: bold; color: #4a2e1b; }
		input, textarea { width: 100%; padding: 10px; border: 1px solid #dcbfa2; border-radius: 6px; box-sizing: border-box; background: #fff; }
		#token { border: 2px solid #8b7355; background: #fff; }
		/* 檔案上傳樣式 */
		.file-area { background: rgba(255,255,255,0.5); padding: 10px; border: 1px dashed #8b7355; border-radius: 6px; margin-bottom: 15px; }
		button { width: 100%; padding: 12px; background: #8b7355; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 5px; font-family: inherit; font-weight: bold; transition: all 0.3s; }
		button:hover { background: #6d5a3e; }
		.btn-upload { background: #6d5a3e; margin-bottom: 10px; }
		.btn-upload:hover { background: #5a4a32; }
		#status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; white-space: pre-line; color: #4a2e1b; }
		hr { margin: 20px 0; border: 0; border-top: 1px solid #dcbfa2; }
		h2 { color: #4a2e1b; margin-top: 0; }
	</style>
</head>
<body>

<div class="admin-card">
	<div style="display:flex;justify-content:space-between;align-items:center;">
		<h2 style="margin:0;">🔑 內容匯入管理</h2>
		<button id="logoutBtn" style="width:auto;padding:6px 12px;font-size:13px;">登出</button>
	</div>
	<div id="adminUser" style="font-size:12px;margin:8px 0 0;color:#8b7355;">驗證登入中...</div>
	
	<div class="field">
		<label>Admin 上傳密碼</label>
		<input type="password" id="token" placeholder="請輸入密碼">
	</div>

	<div class="file-area">
		<label>📁 上傳圖片至 GitHub</label>
		<input type="file" id="fileInput" accept="image/*" multiple>
		<button class="btn-upload" onclick="uploadToGithub()">1. 上傳圖片</button>
	</div>

	<hr>

	<div class="field">
		<label>發佈日期</label>
		<input type="text" id="date">
	</div>

	<div class="field">
		<label>標題</label>
		<input type="text" id="title">
	</div>

	<div class="field">
		<label>內容</label>
		<textarea id="content" rows="6"></textarea>
	</div>

	<div class="field">
		<label>圖片路徑 (自動填入)</label>
		<input type="text" id="pic" placeholder="pic/example.jpg">
	</div>

	<button onclick="sendData()">2. 確認匯入資料庫</button>
	<div id="status"></div>
</div>

<script type="module" src="Javascript/inputData.js"></script>
<script type="module">
	import { requireAdmin, logoutAndGo, supabase } from './Javascript/adminAuth.js';
	const session = await requireAdmin('login.html');
	if (session) {
		document.getElementById('adminUser').innerText = '已登入：' + (session.user?.email || '');
	}
	document.getElementById('logoutBtn').onclick = () => logoutAndGo('login.html');
	supabase.auth.onAuthStateChange((_event, s) => {
		if (!s) location.replace('login.html');
	});
</script>

</body>
</html>
